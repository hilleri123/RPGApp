# TZ=+03 для образов, где есть tzdata (postgres, redis, rabbitmq).
# Свои процессы штампуют 19.10.2026 16:49:05+03 сами.
services:
  app:
    build:
      context: ./RPGdata
      target: dev
    restart: unless-stopped
    environment:
      BASE_URL: http://localhost:6602/api
      PG_ENDPOINT: postgresql://db:5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rpg_sessions
      SECRET_KEY: ${SECRET_KEY}
      ENV: development
      BOT_TOKEN: ${BOT_TOKEN}
      WEB_CLIENT_URL: ${WEB_CLIENT_URL:-http://localhost:6602}
      ROOT_PATH: /api
      RABBIT_URL: ${RABBIT_URL:-amqp://rpg:rpg@rabbitmq:5672/}
      TABLE_BRIDGE_TOKEN: ${TABLE_BRIDGE_TOKEN:-dev-table-bridge}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      TZ: Europe/Moscow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "6601:8000"
    volumes:
      - ./RPGdata:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  web-client:
    build:
      context: ./RPGWebMainClient
      target: dev
    restart: unless-stopped
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      TZ: Europe/Moscow
    ports:
      - "6602:3000"
    volumes:
      - ./RPGWebMainClient:/app
      - /app/node_modules
    depends_on:
      - app


  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rpg_sessions
      TZ: Europe/Moscow
    command: ["postgres", "-c", "log_timezone=Europe/Moscow"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "6603:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10


  pg-backup:
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: rpg_sessions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_COMPRESSION: gzip
      TZ: Europe/Moscow
    volumes:
      - ./backups:/backups


  redis:
    image: redis/redis-stack:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
    volumes:
      - redis_data:/redis_data
    ports:
      - "6606:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rpg}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rpg}
      TZ: Europe/Moscow
    ports:
      - "6607:5672"
      - "6608:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10


  telegram-bot:
    build:
      context: ./telegram-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEB_CLIENT_URL: ${WEB_CLIENT_URL:-http://localhost:6602}
      RABBIT_URL: ${RABBIT_URL:-amqp://rpg:rpg@rabbitmq:5672/}
      TZ: Europe/Moscow
    volumes:
      - ./telegram-bot:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_started

  table-bridge:
    build:
      context: ./table-bridge
    restart: unless-stopped
    environment:
      TABLE_API_URL: http://app:8000
      TABLE_BRIDGE_TOKEN: ${TABLE_BRIDGE_TOKEN:-dev-table-bridge}
      MEDIA_ROOT: /app/media
      TZ: Europe/Moscow
    volumes:
      - media_data:/app/media
    depends_on:
      app:
        condition: service_started

  table-asr:
    build:
      context: ./RPGdata
      target: dev
    restart: unless-stopped
    command: ["python", "-m", "app.workers.table_asr"]
    environment:
      PG_ENDPOINT: postgresql://db:5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rpg_sessions
      SECRET_KEY: ${SECRET_KEY}
      ENV: development
      RABBIT_URL: ${RABBIT_URL:-amqp://rpg:rpg@rabbitmq:5672/}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      MEDIA_ROOT: /app/media
      TZ: Europe/Moscow
    volumes:
      - ./RPGdata:/app
      - media_data:/app/media
    depends_on:
      app:
        condition: service_started
      rabbitmq:
        condition: service_healthy


volumes:
  postgres_data:
  media_data:
  redis_data:
  rabbitmq_data:
